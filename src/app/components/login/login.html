<div class="overlay"></div>

<div class="container">
    <main class="card">

        <div class="card-banner">
            INICIAR SESIÓN
        </div>

        <div class="logo-section">
            <img src="img/logo.png" alt="Logo SIGATAA" class="logo">
        </div>

        <form class="login-form" (submit)="$event.preventDefault()">
            <input type="number" name="matricula" placeholder="Matrícula" required>
            <input type="password" name="password" placeholder="Contraseña" required>
            
            <div class="button-container">
                <button type="submit" class="btn btn-submit">Ingresar</button>
                <a routerLink="/" style="color: #38BDF8; text-decoration: none; font-size: 0.9rem; margin-top: 10px; font-weight: 500;">
                    ← Volver al Inicio</a>
            </div>
        </form>
    </main>
</div> 

<footer class="footer-banner">
    &copy; 2026 SIGATAA. Todos los derechos reservados.
</footer>
